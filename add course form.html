<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course</title>
</head>
<body bgcolor="ECD7F5">
    <center>
    <h1>Add Course</h1>
    </center>
<p> <center>
    <form >
        <table cellspacing="30">
            <tr>
                <td> Course Name</td>
                <td><input type="text" placeholder="Enter the course name" required></td>
            </tr>
            
            <tr>
            
                <td> Course ID</td>
                <td><input type="text" placeholder="Enter the course ID" required></td>
            </tr>
            <tr>
                <td>Course Type</td>
                <td><select name="Course type" required >
                    <option value="C1">Course1</option>
                    <option value="C2">Course2</option>
                    <option value="C3">Course3</option>
                </select></td>
            </tr>
            <tr>
                <td>
                    Description
                </td>
                <td><textarea rows="10" cols="30" placeholder="Enter a brief decription required"></textarea></td>
            </tr>

            <tr>
                <td>Fees</td>
                <td><select name="fees" required>
                    <option value="F1">Fees1</option>
                    <option value="F2">Fees2</option>
                    <option value="F3">Fees3</option>
                </select></td>
            </tr>
            <tr>
                <td>Education:</td>
                <td><input type="checkbox" value="UG">UG
                <input type="checkbox" value="PG">PG
                <input type="checkbox" value="Diploma">Diploma</td>
            </tr>
            <tr>
                <td>Gender:</td>
                <td> <input type="radio" name="Gender" value="Male">Male
                 <input type="radio" name="Gender" value="Female">Female
                     <input type="radio" name="Gender" value="Others">Others
                </td>
            </tr>
            <tr>
                <td>Email</td>
                <td>
                    <input type="email"placeholder="enter a valid email" required>
                </td>
            </tr>
            <tr>
                <td>Password</td>
                <td>
                    <input type="password"placeholder="enter password" required>
                </td>
            </tr>
            <tr> <td></td>
                <td>
                    <input type="submit" value="Add Course">
                    <input type="reset" value="Reset"></td>
                </td>
            </tr>
        </table>
    </form>
    </center>
    </p>
</body>
</html>
